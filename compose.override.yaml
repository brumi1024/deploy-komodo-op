# Override file for environment-specific configuration
# This file overrides the base docker-compose.yaml with Komodo environment variables

services:
  op-connect-api:
      # Upstream publishes 8080 on every interface. This stack now runs on the
      # internet-facing host, where only the loopback binding is defensible.
      ports: !override
        - "127.0.0.1:8080:8080"
      volumes: !override
        # Remove the credentials file mount by explicitly setting volumes
        - "op-connect-data:/home/opuser/.op/data"
      environment:
        # Override to use Base64-encoded credentials from Komodo variable
        OP_SESSION: "${OP_CREDENTIALS_BASE64}"
  op-connect-sync:
      volumes: !override
        # Remove the credentials file mount by explicitly setting volumes
        - "op-connect-data:/home/opuser/.op/data"
      environment:
        # Override to use Base64-encoded credentials from Komodo variable
        OP_SESSION: "${OP_CREDENTIALS_BASE64}"
  komodo-op:
    environment:
      # Override with actual Komodo configuration
      KOMODO_HOST: "${KOMODO_HOST}"
      KOMODO_API_KEY: "${KOMODO_API_KEY}"
      KOMODO_API_SECRET: "${KOMODO_API_SECRET}"
      OP_SERVICE_ACCOUNT_TOKEN: "${OP_SERVICE_ACCOUNT_TOKEN}"
      OP_VAULT: "${OP_VAULT}"
      SYNC_INTERVAL: "${SYNC_INTERVAL:-30s}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # OP_CONNECT_HOST is fine as-is since it's internal Docker networking
    # Core publishes 9120 on loopback only, so it is reachable neither through
    # the host gateway nor from another host. Joining its ingress network and
    # addressing the container directly is the only private path to it.
    networks:
      - default
      - vps-ingress

networks:
  vps-ingress:
    external: true
    name: vps-ingress
